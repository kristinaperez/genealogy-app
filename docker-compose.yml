services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: genealogy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genealogy}
      POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # удалите в продакшене
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genealogy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-совместимое хранилище фото) ────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: genealogy_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web-консоль MinIO
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Создание бакета при первом запуске ───────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: genealogy_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000
          ${MINIO_ROOT_USER:-minioadmin}
          ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/photos;
        mc anonymous set download local/photos;
      "

  # ─── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genealogy_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-genealogy}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-genealogy}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: photos
      MINIO_USE_SSL: "false"
    volumes:
      - ./backend:/app # hot-reload в dev-режиме
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── React frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genealogy_web
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules # не перезаписывать node_modules с хоста
    ports:
      - "4173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    command: npm run dev -- --host

volumes:
  postgres_data:
  minio_data:
